# Builds the Docker image on every push to main and pushes it to
# ghcr.io/j0m1ty/auth. The server only pulls it (see J0m1ty/jombox).
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/j0m1ty/auth:latest
            ghcr.io/j0m1ty/auth:${{ github.sha }}
