version: 2
updates:
    - package-ecosystem: npm # also handles pnpm-lock.yaml
      directory: /
      schedule: { interval: weekly }
      cooldown: { default-days: 5 } # skip versions younger than 5 days (supply-chain buffer)
      groups:
          npm-security:
              applies-to: security-updates
              patterns: ['*']
          npm-minor-patch:
              patterns: ['*']
              update-types: [minor, patch]
    - package-ecosystem: docker
      directory: /
      schedule: { interval: weekly }
      cooldown: { default-days: 5 }
    - package-ecosystem: github-actions
      directory: /
      schedule: { interval: weekly }
      cooldown: { default-days: 5 }
      groups:
          actions:
              patterns: ['*']
